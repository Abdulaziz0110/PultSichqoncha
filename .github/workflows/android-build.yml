name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - '*-project.zip'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file=""
          best=0
          for f in *-project.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || true)
            t=${t:-0}
            if [ -z "$zip_file" ] || [ "$t" -gt "$best" ]; then
              zip_file="$f"
              best="$t"
            fi
          done
          if [ -z "$zip_file" ]; then
            echo "No *-project.zip found in the repository root"
            exit 1
          fi
          echo "Using $zip_file"
          rm -rf /tmp/pz
          mkdir -p /tmp/pz/x
          cp "$zip_file" /tmp/pz/project.zip
          unzip -q /tmp/pz/project.zip -d /tmp/pz/x
          src=/tmp/pz/x
          if [ ! -f "$src/settings.gradle.kts" ]; then
            count=$(find "$src" -mindepth 1 -maxdepth 1 | wc -l)
            only=$(find "$src" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ "$count" -eq 1 ] && [ -n "$only" ]; then
              src="$only"
            fi
          fi
          if [ ! -f "$src/settings.gradle.kts" ]; then
            echo "settings.gradle.kts was not found in the ZIP"
            exit 1
          fi
          rm -rf "$src/.git" "$src/.github" "$src/signing"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name signing ! -name '*.zip' -exec rm -rf {} +
          cp -a "$src"/. .
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create signing key (first run only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f signing/release.jks ] && [ -f signing/signing.properties ]; then
            echo "Signing key already exists"
            exit 0
          fi
          mkdir -p signing
          rm -f signing/release.jks
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore signing/release.jks -storetype PKCS12 \
            -alias pult -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$pass" -keypass "$pass" \
            -dname "CN=Pult Sichqoncha, O=Pult, C=UZ"
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$pass" "pult" "$pass" > signing/signing.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f signing/release.jks signing/signing.properties
          git commit -m "Add signing key [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: gradle --no-daemon test

      - name: Lint
        id: lint
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn

      - name: Fail if tests or lint failed
        if: steps.unit.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: exit 1
